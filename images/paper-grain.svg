<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".48" numOctaves="3" seed="8" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .30
                                        0 0 0 0 .24
                                        0 0 0 0 .18
                                        1.5 1.5 1.5 0 -2"/>
  </filter>
  <rect width="160" height="160" filter="url(#grain)" opacity=".32"/>
</svg>
